name: Publish UFPR image assets
on:
  push:
    paths:
      - 'ufpr-v11-payload.tar.gz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract validated PNG paths and commit
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile, pathlib
          f=pathlib.Path('ufpr-v11-payload.tar.gz')
          if not f.is_file():
              raise SystemExit("No payload archive")
          with tarfile.open(f,'r:gz') as tar:
              ms=tar.getmembers()
              for m in ms:
                  path=pathlib.PurePosixPath(m.name)
                  if (not m.isfile()) or len(path.parts)!=3 or path.parts[0]!='ufpr' or not path.parts[1].isdigit() or path.suffix.lower() not in ('.png','.jpg','.jpeg','.webp'):
                      raise SystemExit("Unsafe archive member: "+m.name)
              tar.extractall(path='.',filter='data')
          f.unlink()
          PY
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ufpr/ ufpr-v11-payload.tar.gz
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified high-resolution UFPR diagrams"
          git push
